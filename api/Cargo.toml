[package]
name = "mod-chat_translate"
version = "0.2.2"
edition = "2024"

[dependencies]
# The launcher points this at the Horizon source it builds the game from. Every other
# dependency must be a crate and version already in Horizon's Cargo.lock.
horizon-client = { git = "https://github.com/horizon-rust/horizon", rev = "83ad384f48d0742746d518737511882680aab5b7" }
ureq = { version = "2", default-features = false, features = ["tls"] }
serde_json = "1"
